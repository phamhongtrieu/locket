<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - LocketGold System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/css/custom.css">
</head>
<body class="flex items-center justify-center min-h-screen px-4 bg-[#f8fafc] text-slate-800 relative overflow-hidden font-sans">

  <!-- Background Pastel Glow -->
  <div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden">
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-pink-200/50 rounded-full blur-3xl"></div>
    <div class="absolute top-20 right-10 w-[500px] h-[500px] bg-purple-200/40 rounded-full blur-3xl"></div>
  </div>

  <div class="w-full max-w-md bg-white/80 backdrop-blur-md border border-white/90 p-8 sm:p-10 rounded-2xl shadow-xl shadow-indigo-500/5 relative">
    
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 text-white flex items-center justify-center shadow-md shadow-blue-500/20">
          <i class="fa-solid fa-crown text-2xl"></i>
        </div>
        <span class="font-black text-3xl tracking-tight text-slate-900">
          Locket<span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">Gold</span>
        </span>
      </a>
      <h2 class="mt-4 text-xl font-black text-slate-900">Đăng Nhập Tài Khoản</h2>
      <p class="text-xs text-slate-500 mt-1">Quản lý ví và theo dõi đơn hàng của bạn</p>
    </div>

    <!-- Alert message -->
    <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm font-medium"></div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-2">Địa chỉ Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
            <i class="fa-solid fa-envelope"></i>
          </span>
          <input type="email" id="email" required placeholder="example@gmail.com" 
            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-medium placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 transition-all">
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-slate-600 mb-2">Mật khẩu</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input type="password" id="password" required placeholder="••••••••" 
            class="w-full pl-11 pr-4 py-3.5 bg-slate-50 border border-slate-200 rounded-xl text-slate-900 font-medium placeholder-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white focus:ring-2 focus:ring-indigo-500/20 transition-all">
        </div>
      </div>

      <button type="submit" id="btn-submit" class="w-full py-4 rounded-xl bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white text-base font-black shadow-lg shadow-indigo-500/25 flex items-center justify-center gap-2 transition-all">
        <span>Đăng Nhập</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div class="mt-8 text-center text-sm text-slate-500">
      Chưa có tài khoản? 
      <a href="/register.html" class="text-indigo-600 font-bold hover:underline">Tạo tài khoản ngay</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
